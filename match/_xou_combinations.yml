name: _xou_combinations
matches:
- replace: 'would be like '
  propagate_case: true
  allow_duplicate: false
  trigger: woubl,
- replace: 'could be like '
  propagate_case: true
  allow_duplicate: false
  trigger: qoubl,
- replace: 'should be like '
  propagate_case: true
  allow_duplicate: false
  trigger: soubl,
