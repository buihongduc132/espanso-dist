- replace: 'answers '
  propagate_case: true
  allow_duplicate: false
  trigger: anss,
- replace: 'answering '
  propagate_case: true
  allow_duplicate: false
  trigger: ansi,
- replace: 'answered '
  propagate_case: true
  allow_duplicate: false
  trigger: ansp,
- replace: 'answerable '
  propagate_case: true
  allow_duplicate: false
  trigger: ansb,
- replace: 'unanswerable '
  propagate_case: true
  allow_duplicate: false
  trigger: ansnb,
