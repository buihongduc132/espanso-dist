name: _images
matches:
- replace: '{{output}} '
  regex: :img2:kit
  vars:
  - name: output
    type: shell
    params:
      cmd: xclip -selection clipboard -t image/png -i '/home/bhd/Documents/cc_assets/kit.png'
        && echo 'DONE'
  propagate_case: true
  allow_duplicate: false
- replace: '{{clipb}} '
  regex: ::iimg_(?P<category>[^:]+):(?P<name>.+)__
  vars:
  - name: clipb
    type: clipboard
  propagate_case: true
  allow_duplicate: false
- regex: ::img:kit
  image_path: /home/bhd/Documents/cc_assets/kit.png
  propagate_case: true
  allow_duplicate: false
