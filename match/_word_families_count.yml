  allow_duplicate: false
  trigger: qntb,
- replace: 'counts '
  duplicate_group: qnts-conflict
  _tags:
  - verb
  - else
  - pronoun
  allow_duplicate: true
  propagate_case: true
  trigger: qnts,
- replace: 'counting '
  _tags:
  - ing
  - verb
  - can
  - else
  - pronoun
  allow_duplicate: true
  propagate_case: true
  trigger: qnti,
- replace: 'counted '
  _tags:
  - ed
  - verb
  - would
  - else
  - pronoun
  allow_duplicate: true
  propagate_case: true
  trigger: qntp,
