- replace: "• RCA-First Troubleshooting Charter\n\n- Principles\n    - Fix the root\
    \ cause, not symptoms.\n    - Minimize blast radius and reversibly change only\
    \ one thing at a time.\n    - Evidence over intuition; hypotheses require proof.\n\
    - Reproduce\n    - Create the smallest reliable repro (single command/script).\n\
    \    - Capture baseline: timestamped CPU/memory/I/O/latency and the exact invocation.\n\
    \    - Freeze variables: same inputs, environment, and versions.\n- Localize\n\
    \    - Narrow by halves: disable features or isolate components until the signal\
    \ drops.\n    - Identify the hot path with file:line or function and the triggering\
    \ condition.\n    - Confirm with at least one independent signal (e.g., logs +\
    \ profiler, metrics + traces).\n- Containment (only if explicitly allowed)\n \
    \   - Use process/OS-level measures (nice/limits/restarts) that are fully reversible.\n\
    \    - No code/config tuning (timeouts, retries, sleeps, caches) before cause\
    \ is proven.\n- Fix\n    - Add a failing test that encodes the repro; confirm\
    \ it fails for the right reason.\n    - Implement the smallest change that makes\
    \ the test pass; no drive‑by refactors.\n    - Include a rollback plan and guardrails\
    \ (input validation, bounds, timeouts if intrinsic to the fix).\n- Validate\n\
    \    - Rerun the repro on the fixed build; collect the same metrics under identical\
    \ conditions.\n    - Show before/after deltas and verify no regressions in adjacent\
    \ behavior.\n    - Soak, then recheck key signals (errors, latency, resource use).\n\
    - Deliverables\n    - Repro steps (copy‑pasteable), cause summary (one sentence),\
    \ precise code references, fix diff.\n    - Test name/location and why it fails\
    \ pre‑fix/passes post‑fix.\n    - Metrics with timestamps and commands used; rollback\
    \ instructions.\n- Never Do\n    - Don’t “tune” to hide issues (timeouts/retries/backoffs/sleeps)\
    \ without prior approval.\n    - Don’t change multiple variables at once or ship\
    \ unmeasured fixes.\n    - Don’t rely on logs alone when profilers/metrics can\
    \ confirm.\n- When Uncertain\n    - State assumptions, propose 2–3 falsifiable\
    \ checks, and run the cheapest first.\n    - Escalate early if blocked on data,\
    \ access, or environment parity.\n "
