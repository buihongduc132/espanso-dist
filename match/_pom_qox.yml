- replace: "There are another remote AI AGENT that will do the pr review. It's will\
    \ by default using these patterns:\n\n```text\nStandard code review patterns\n\
    When custom style guides aren't specified, these are the main categories of areas\
    \ where Gemini Code Assist focuses its code review on:\n\nCorrectness: Makes sure\
    \ the code functions as intended and handles edge cases, checks for logic errors,\
    \ race conditions, or incorrect API usage.\n\nEfficiency: Identifies potential\
    \ performance bottlenecks or areas for optimization, like excessive loops, memory\
    \ leaks, inefficient data structures, redundant calculations, excessive logging,\
    \ and inefficient string manipulation.\n\nMaintainability: Assesses code readability,\
    \ modularity, and adherence to language idioms and best practices. Targets poor\
    \ naming for variables, functions, and classes, lack of comments or documentation,\
    \ complex code, code duplication, inconsistent formatting, and magic numbers.\n\
    \nSecurity: Identifies potential vulnerabilities in data handling or input validation,\
    \ like insecure storage of sensitive data, injection attacks, insufficient access\
    \ controls, Cross-Site Request Forgery (CSRF), and Insecure Direct Object References\
    \ (IDOR).\n\nMiscellaneous: Other topics are considered when reviewing the pull\
    \ request, like testing, performance, scalability, modularity and reusability,\
    \ and error logging and monitoring.\n```\n\nNow by current document and your understand\
    \ of the project. Ensure the file `.gemini/styleguide.md` to have including these\
    \ above aspect and also tailored instruction for it to aligns with the current\
    \ project.\n\nThen ensure these information are available in there as well (as-is\
    \ , without any rewording)\n\n```text\nYou will not just review about the coding\
    \ but also the alignment of the implementation with the initial document and requirement\
    \ as well.\n\nAny things violate the below will me mark as CRITICAL, even if it's\
    \ not bug or coding problem:\n- all the works MUST aligned with the original document\
