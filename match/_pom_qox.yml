- replace: "Requirement:\n```\n- Purpose\n      - Expose all inter-component contracts\
    \ via a unified produces/consumes pattern wired with symlinks so artifacts stay\
    \ synchronized inside the repo.\n- Layout\n    - Producer (source of truth): components/<component>/interfaces/produces/<contract>/\n\
    \    - Canonical mount: interfaces/data/<contract> → symlink to the producer dir\
    \ (exactly one producer per contract)\n    - Consumer: components/<component>/interfaces/consumes/data/<contract>\
    \ → symlink to interfaces/data/<contract>\n- Invariants\n    - One producer per\
    \ contract; consumers never modify artifacts.\n    - No copies; only symlinks\
    \ along producer → interfaces/data → consumer.\n    - Artifacts are Git-tracked\
    \ and reviewable.\n- Contracts (examples, not exhaustive)\n    - openapi/ (HTTP\
    \ API schemas)\n    - asyncapi/ (event schemas)\n    - db/ (database schemas/migrations)\n\
    \    - redis/ (key/value schemas, TTLs)\n    - Add others as needed under the\
    \ same pattern.\n- Producer responsibilities\n    - Keep the contract files in\
    \ interfaces/produces/<contract>/.\n    - Update artifacts there; document any\
    \ breaking changes within that contract folder if needed.\n- Canonical mount\n\
    \    - Create/maintain a single symlink at interfaces/data/<contract> pointing\
    \ to the producer’s folder.\n- Consumer responsibilities\n    - Depend only on\
    \ components/<comp>/interfaces/consumes/data/<contract> (symlink to canonical\
    \ mount).\n    - Regenerate or read from the symlinked contract; do not duplicate\
    \ artifacts.\n- Adding a new contract\n    - Create producer dir under components/<producer>/interfaces/produces/<contract>/\
    \ and place artifacts.\n    - ln -sfn components/<producer>/interfaces/produces/<contract>\
    \ interfaces/data/<contract>\n    - ln -sfn interfaces/data/<contract> components/<consumer>/interfaces/consumes/data/<contract>\n\
    - Updating a contract\n    - Change artifacts in the producer dir; the symlink\
    \ chain propagates to interfaces/data and all consumers automatically.\n\n```\n\
    \n```\nHere’s a practical, SDK‑free, Git‑tracked way to cover contracts beyond\
    \ HTTP/JSON — DBs, Redis, Kafka, and mixed stacks — with zero‑cost, open tooling\
    \ and a uniform layout.\n\nUniform, Git‑tracked contracts\n\n- Versioned specs\
    \ live under interfaces/data and flow to components via symlinks (produces → data\
    \ → consumes).\n- Validate every contract in CI via CLI tools; block merges on\
    \ drift.\n- Prefer plain, stable formats (YAML/JSON/SQL/DBML/HCL/Avro) over codegen‑only\
    \ artifacts.\n\nRecommended open formats + CLIs (free, no limits)\n\n- HTTP APIs:\
    \ OpenAPI JSON/YAML + spectral (lint), ajv‑cli (schema validate), openapi-generator-cli\
    \ (optional).\n- Events/streams (Kafka/Redpanda/NATS): AsyncAPI YAML + message\
    \ schemas in Avro or JSON Schema; asyncapi CLI, ajv‑cli/avro-tools.\n- Relational\
    \ DB schema: pick one canonical source and keep SQL snapshots.\n    - Option A\
    \ (migrations-as-code): Atlas (HCL + migrate/lint/diff) or Sqitch (change management,\
    \ no “up/down” trap). Both are OSS.\n    - Option B (descriptive): DBML (dbml-cli\
    \ for diagrams/codegen) plus SQL migrations (Flyway/Liquibase Community or Atlas).\n\
    - Caches (Redis): declare keyspace contracts as YAML + JSON Schemas; validate\
    \ with a tiny CLI script (Python/Node) and ajv‑cli. No server plugin required.\n\
    - Search indexes: JSON index mappings (OpenSearch/Elasticsearch) + jq/schematests.\n\
    - Jobs/queues: JSON Schema for payloads + ajv‑cli.\n\nOrches layout (uniform)\n\
    \n- Producer (backend): components/backend/interfaces/produces/\n    - openapi/api.json\n\
    \    - asyncapi/events.yml\n    - db/atlas/schema.hcl and/or db/sql/migrations/...\n\
    \    - redis/contracts.yml and redis/schemas/*.schema.json\n- Canonical mount:\
    \ interfaces/data/\n    - openapi -> symlink to backend produces/openapi\n   \
    \ - asyncapi -> symlink to backend produces/asyncapi\n    - db -> symlink to backend\
    \ produces/db\n    - redis -> symlink to backend produces/redis\n- Consumer (frontend/others):\
    \ components/<comp>/interfaces/consumes/data/<contract> -> symlink to interfaces/data/<contract>\n\
    \nValidation (CLI‑first; add to CI)\n\n- OpenAPI:\n    - spectral lint interfaces/data/openapi/api.json\n\
    \    - python scripts/check_openapi_drift.py (already present)\n- AsyncAPI:\n\
    \    - asyncapi validate interfaces/data/asyncapi/events.yml\n- Avro/JSON Schema\
    \ messages:\n    - avro-tools idl or ajv validate -s schema.json -d sample.json\n\
    - DB (choose one):\n    - Atlas: atlas schema lint -f interfaces/data/db/atlas/schema.hcl;\
    \ atlas migrate diff …; atlas schema diff …\n    - Sqitch: sqitch verify; sqitch\
    \ deploy --verify (against disposable DB)\n    - DBML (complement): dbml-render\
    \ for diagrams; generate SQL and compare vs canonical snapshot\n- Redis:\n   \
    \ - python scripts/redis_contract_check.py --spec interfaces/data/redis/contracts.yml\
    \ (walk keys, fetch samples, validate with ajv)\n\nExample Redis contract (tracked,\
    \ uniform)\n\n- interfaces/data/redis/contracts.yml\n    - key_pattern: user:{id}:profile\n\
    \    - type: json (or hash/string)\n    - ttl_seconds: 86400\n    - schema: schemas/user_profile.schema.json\n\
    \    - invariants: unique_fields: [id], required_fields: [...]\n- interfaces/data/redis/schemas/user_profile.schema.json:\
    \ JSON Schema for the value\n- A tiny script connects to REDIS_URL and validates\
    \ live keys against schema + TTL.\n\nRelational DB contract (two proven paths)\n\
    \n- Atlas (cleanest for multi‑DB): interfaces/data/db/atlas/schema.hcl as source‑of‑truth;\
    \ keep SQL snapshots per dialect under interfaces/data/db/sql/<dialect>/schema.sql;\
    \ use atlas diff to guard drifts.\n- Sqitch (migration discipline): interfaces/data/db/sql/sqitch/{deploy,revert,verify}/…;\
    \ sqitch plan tracks order; verification is first‑class.\n\nMessaging/event contract\n\
    \n- AsyncAPI in interfaces/data/asyncapi/events.yml describes channels, bindings\
    \ (kafka), and references to message schemas under interfaces/data/asyncapi/schemas/*.avsc\
    \ or *.schema.json.\n- Validate with asyncapi CLI; validate message examples with\
    \ avro-tools/ajv‑cli.\n\nSDK‑free integration for CLI agents\n\n- Everything above\
    \ runs via CLIs or Docker:\n    - spectral/ajv/asyncapi/openapi-generator/atlas/sqitch/dbml-cli/avro-tools\n\
    - Gate scripts under scripts/contracts/* (bash/python). Example:\n    - scripts/contracts/validate_all.sh\
    \ runs each validator; exit non‑zero on any drift.\n    - scripts/contracts/render_db_diagram.sh\
    \ (dbml-cli) for quick visual reviews.\n- Consumers regenerate types/clients via\
    \ openapi-generator-cli, or skip codegen and use plain HTTP with schemas for validation.\n\
    \nWhy not Schema Registry or Pact by default?\n\n- Registry (Confluent): powerful\
    \ but adds infrastructure and governance model; use only when you actually need\
    \ runtime schema enforcement across independent teams. If you do, prefer OSS registries\
    \ like Apicurio Registry or Karapace (both free) and interact via REST/CLI.\n\
    - Pact: valuable with many cross‑team consumer/provider pairs and frequent changes.\
    \ It adds a broker and test wiring. Start with static specs + CI validation; add\
    \ Pact later if coordination pain appears.\n\nMinimal starter checklist (actionable)\n\
    \n- OpenAPI: already wired (interfaces/data/openapi).\n- Add AsyncAPI scaffold:\
    \ interfaces/data/asyncapi/events.yml (+ schemas/).\n- Add DB contract:\n    -\
    \ Pick Atlas or Sqitch; create interfaces/data/db/{atlas|sql}/…; wire a make contracts-db-check\
    \ target.\n- Add Redis contract:\n    - Add interfaces/data/redis/contracts.yml\
    \ and schemas/; add scripts/redis_contract_check.py.\n- CI:\n    - make contracts-check\
    \ running spectral, asyncapi, ajv, and your DB/Redis validators; block merge on\
    \ failure.\n\n```\n "
