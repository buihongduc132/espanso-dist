name: _auto_tests_status
matches:
- replace: 'all tests passed '
  _tags:
  - test
  - test
  - all
  - passed
  propagate_case: true
  allow_duplicate: false
  trigger: atsp,
- replace: 'tests failed '
  _tags:
  - test
  - test
  - failed
  propagate_case: true
  allow_duplicate: false
  trigger: tstf,
- replace: 'tests failing '
  _tags:
  - test
  - test
  - failing
  propagate_case: true
  allow_duplicate: false
  trigger: tstfi,
