name: _ai
global_vars:
- name: PYTHON_CMD
  type: var
  params:
    name: python
- name: SCRIPTS_DIR
  type: path
  params:
    path: '{{BASE_DIR}}/scripts'
matches:
- replace: 'stelterlab/DeepSeek-R1-Distill-Qwen-14B-AWQ '
  _tags:
  - pronoun
  - will
  - to
  - can
  - be
  - would
  - else
  propagate_case: true
  allow_duplicate: false
  trigger: ::loqalmodel,
- replace: '{{output}} '
  regex: ::itmo (?P<question>.+)
  vars:
  - name: output
    type: script
    params:
      args:
      - '{{PYTHON_CMD}}'
      - '{{SCRIPTS_DIR}}/openai_query.py'
      - '{{question}}'
  propagate_case: true
  allow_duplicate: false
- replace: '{{output}} '
  regex: ::gem (?P<question>.+)
  vars:
  - name: output
    type: script
    params:
      args:
      - '{{PYTHON_CMD}}'
      - '{{SCRIPTS_DIR}}/gemini_query.py'
      - '{{question}}'
  propagate_case: true
  allow_duplicate: false
