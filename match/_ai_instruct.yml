name: _ai_instruct
global_vars:
- name: _name_file
  type: echo
  params:
    echo: raw_name.txt
matches:
- replace: '{{output}} '
  vars:
  - name: output
    type: shell
    params:
      cmd: cat {{OS_CONFIG_DIR}}/ai/common/tool_apply_fix.md
  _tags:
  - to
  - else
  - pronoun
  propagate_case: true
  allow_duplicate: false
  trigger: ::ins:toolfix,
- replace: '{{output}} '
  vars:
  - name: output
    type: shell
    params:
      cmd: cat {{OS_CONFIG_DIR}}/ai/common/tests/test_instruction.md
  _tags:
  - to
  - else
  - pronoun
  propagate_case: true
  allow_duplicate: false
  trigger: ::ins:test,
- replace: '{{output}} '
  vars:
  - name: output
    type: shell
    params:
      cmd: cat {{OS_CONFIG_DIR}}/ai/common/coding/standards.md
  _tags:
  - pronoun
  - ing
  - to
  - can
  - would
  propagate_case: true
  allow_duplicate: false
  trigger: ::ins:qoding,
- replace: '{{output}} '
  vars:
  - name: output
    type: shell
    params:
      cmd: cat {{OS_CONFIG_DIR}}/ai/common/worklog.md
  _tags:
  - will
  - to
  - else
  - pronoun
  propagate_case: true
  allow_duplicate: false
  trigger: ::ins:wowklog,
- replace: '{{output}} '
  vars:
  - name: output
    type: shell
    params:
      cmd: cat {{OS_CONFIG_DIR}}/ai/common/preflights.md
  _tags:
  - the
  - to
  - else
  - pronoun
  propagate_case: true
  allow_duplicate: false
  trigger: ::ins:pweflight,
- replace: '{{output}} '
  vars:
  - name: output
    type: shell
    params:
      cmd: cat {{OS_CONFIG_DIR}}/ai/openhands/cloned_work.md
  _tags:
  - to
  - will
  - can
  propagate_case: true
  allow_duplicate: false
  trigger: ::qw,
- replace: '{{output}} '
  vars:
  - name: output
    type: shell
    params:
      cmd: head /dev/urandom | tr -dc 0-9 | head -c 10
  _tags:
  - to
  propagate_case: true
  allow_duplicate: false
  trigger: ::num10,
- replace: '{{output}} '
  vars:
  - name: output
    type: shell
    params:
      cmd: head /dev/urandom | tr -dc 0-9 | head -c 6
  _tags:
  - to
  propagate_case: true
  allow_duplicate: false
  trigger: ::num,
- replace: '{{output}} '
  vars:
  - name: output
    type: shell
    params:
      cmd: shuf -n 1 {{BASE_DIR}}/conf/data/{{_name_file}}
  _tags:
  - to
  - else
  propagate_case: true
  allow_duplicate: false
  trigger: ::name,
- replace: '{{output}} '
  vars:
  - name: output
    type: shell
    params:
      cmd: name1=$(shuf -n 1 {{BASE_DIR}}/conf/data/{{_name_file}}); name2=$(shuf
        -n 1 {{BASE_DIR}}/conf/data/{{_name_file}}); echo "$name1 $name2"
  _tags:
  - to
  - else
  propagate_case: true
  allow_duplicate: false
  trigger: ::fname,
- replace: '{{output}} '
