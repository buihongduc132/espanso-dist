name: _forms
matches:
- replace: '{{output}} '
  vars:
  - name: trigger_form
    type: form
    params:
      layout: 'bbreviation/Trigger

        [[apprv]]


        Expansion/Replacement

        [[expansion]]


        Expansion Type

        [[expansion_type]]

        Values: [common, phrase, family, bex]

        Default: common


        Notes

        [[notes]]

        '
  - name: output
    type: script
    params:
      args:
      - '{{python}}'
      - '{{BASE_DIR}}/scripts/add_new_trigger.py'
      - '{{trigger_form.apprv}}'
      - '{{trigger_form.expansion}}'
      - '{{trigger_form.expansion_type}}'
      - '{{trigger_form.notes}}'
  _tags:
  - to
  - pronoun
  propagate_case: true
  allow_duplicate: false
  trigger: :po,
