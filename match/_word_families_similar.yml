name: _word_families_similar
matches:
- replace: 'similar '
  propagate_case: true
  allow_duplicate: false
  trigger: sim,
- replace: 'similarly '
  propagate_case: true
  allow_duplicate: false
  trigger: siml,
- replace: 'similarity '
  propagate_case: true
  allow_duplicate: false
  trigger: simm,
- replace: 'similarities '
  propagate_case: true
  allow_duplicate: false
  trigger: simms,
- replace: 'not similar '
  propagate_case: true
  allow_duplicate: false
  trigger: nsim,
- replace: 'similar to the '
  propagate_case: true
  allow_duplicate: false
  trigger: sim2h,
